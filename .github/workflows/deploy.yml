# main 에 push 하면 검사 → D1 마이그레이션 → Cloudflare Workers(mycar-note) 배포 → 배포 사이트 확인
# 필요한 GitHub Secrets: CLOUDFLARE_API_TOKEN(Workers 편집 + D1 편집), CLOUDFLARE_ACCOUNT_ID
# Worker 비밀값(AUTH_* · INTERNAL_JOB_TOKEN)은 Cloudflare 에 저장돼 있어 여기서 넣지 않음
name: Deploy

on:
  push:
    branches: [main]
    # 문서만 바뀐 push 는 배포하지 않음
    paths-ignore:
      - '**.md'
  workflow_dispatch: # Actions 탭에서 직접 다시 배포할 때

# 연달아 push 하면 앞의 배포가 끝난 뒤 다음 배포 (중간에 끊지 않음)
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # 시크릿이 없으면 GitHub 는 빈 값을 넘기므로, 어느 것이 비었는지 알려 주고 멈춤 (값은 출력 안 함)
      - name: Check secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN 시크릿이 비어 있음 (Settings > Secrets and variables > Actions)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID 시크릿이 비어 있음"; exit 1; }
          echo "secrets ok"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 마이그레이션을 먼저: 실패하면 여기서 멈춰서, 옛 스키마 위에 새 코드가 올라가지 않음
      - run: npm run db:migrate:remote
      # deploy 가 빌드까지 함. CI 에선 커밋 메시지 전체가 Worker 버전 메모로 붙는데 Cloudflare 길이 제한(100자)을 넘어서 비움
      - run: npm run deploy -- --message ""
      - name: Smoke test
        run: curl -fsS --retry 3 --retry-delay 5 https://mycar-note.fridgeo.workers.dev/api/health
